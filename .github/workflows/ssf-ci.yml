name: SSF CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssf-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show tool versions
        shell: bash
        run: |
          set -euo pipefail
          git --version
          node --version
          php --version
          pwsh --version

      - name: Check changed lines
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          elif [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "$zero" ]]; then
            git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
          else
            git diff-tree --check --root "$GITHUB_SHA"
          fi

      - name: Lint PHP files
        shell: bash
        run: git ls-files -z -- '*.php' | xargs -0 -r -n1 php -l

      - name: Check JavaScript syntax
        shell: bash
        run: git ls-files -z -- '*.js' '*.mjs' | xargs -0 -r -n1 node --check

      - name: Run offline regression suite
        shell: pwsh
        run: ./scripts/tests/ssf-ci-tests.ps1
